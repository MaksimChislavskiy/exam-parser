[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-parser"
version = "0.1.0"
description = "Extract mathematical exam tasks with PaddleOCR and selectable LLM providers"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle-gpu==3.3.1",
    "nvidia-cudnn-cu12==9.5.1.17",
    "paddlex[ocr]==3.7.1",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "gigachat==0.2.1",
    "openai>=1.0.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "setuptools>=82.0.1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
exam-parser = "exam_parser.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["exam_parser*"]

[tool.uv]
link-mode = "copy"
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
